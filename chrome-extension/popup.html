<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>CloudTech Quick Access</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <div class="logo-area">
      <span class="cloud-icon">☁</span>
      <span class="header-title">CloudTech</span>
    </div>
    <span class="header-badge">Quick Portal</span>
  </div>

  <div class="card-list">
    <!-- 1. Home -->
    <a href="#" class="card" data-url="https://kws-cloud-tech.com/">
      <div class="card-icon home-icon">🏠</div>
      <div class="card-content">
        <div class="card-title">CloudTech ホーム</div>
        <div class="card-desc">公式トップ・マイページ</div>
      </div>
      <div class="card-arrow">➔</div>
    </a>

    <!-- 2. AWS Course -->
    <a href="#" class="card" data-url="https://kws-cloud-tech.com/courses/aws-course/">
      <div class="card-icon aws-icon">☁</div>
      <div class="card-content">
        <div class="card-title">AWSコース一覧</div>
        <div class="card-desc">実践的な学習カリキュラム</div>
      </div>
      <div class="card-arrow">➔</div>
    </a>

    <!-- 3. Cert Video -->
    <a href="#" class="card" data-url="https://kws-cloud-tech.com/lessons/cert-video-intro/">
      <div class="card-icon video-icon">🎬</div>
      <div class="card-content">
        <div class="card-title">資格対策動画</div>
        <div class="card-desc">認定試験対策の動画講義</div>
      </div>
      <div class="card-arrow">➔</div>
    </a>

    <!-- 4. New Cert -->
    <a href="#" class="card" data-url="https://kws-cloud-tech.com/courses/new-cert/">
      <div class="card-icon cert-icon">🎓</div>
      <div class="card-content">
        <div class="card-title">新資格対策コース</div>
        <div class="card-desc">最新認定試験対策コース</div>
      </div>
      <div class="card-arrow">➔</div>
    </a>
  </div>

  <div class="footer">
    ワンクリックで新しいタブを開きます
  </div>

  <script src="popup.js"></script>
</body>
</html>
